         padding:20px 18px; line-height:1.85; font-size:0.9rem; color:#ccc; }
  .doc h2 { color:var(--gold); font-size:1rem; margin:20px 0 6px; } .doc h2:first-child { margin-top:0; }

  document.getElementById('doc').innerHTML = promoTerms(days, tokens).map(function (x) { return '<h2>' + x[0] + '</h2><p>' + x[1] + '</p>'; }).join('') +
