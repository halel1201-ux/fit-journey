<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <script>/* opened as a local file:// copy — fetch/SW are blocked there; jump to the live site */if(location.protocol==='file:')location.replace('https://halel1201-ux.github.io/fit-journey/'+location.pathname.split('/').pop()+location.search);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HF Coaching">
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
  <title>פאנל ניהול — HF Coaching</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <!-- self-hosted: in the native app this loads from the bundle instead of
       making a blocking round trip to jsdelivr on every page switch -->
  <script src="vendor/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --orange:#FF6B00; --gold:#FFD700; --black:#090909; --graphite:#111; --white:#fff; --muted:#888; --card:rgba(255,255,255,0.04); --border:rgba(255,107,0,0.25); }

    /* 🎨 תפריטי בחירה (select): רקע כהה + כיתוב לבן — אחרת האופציות לא נראות */
    select { color-scheme: dark; }
    select option, select optgroup { background-color:#1a1a1a; color:#ffffff; }
    html, body { overflow-x: clip; } /* block sideways drag/reveal of off-screen fixed panels */
    body { font-family: 'Heebo', sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: #0e0e0e; } ::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 3px; }

    /* TOP NAV */
    .topnav {
      height: 58px; background: rgba(9,9,9,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,107,0,0.15);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; position: sticky; top: 0; z-index: 100;
    }
    .topnav-brand { font-size: 1.2rem; font-weight: 900; background: linear-gradient(135deg, var(--orange), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .topnav-sub { font-size: 0.75rem; color: var(--muted); }
    .btn-sm {
      padding: 7px 16px; border-radius: 6px; font-family: 'Heebo', sans-serif;
      font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: background 0.2s, opacity 0.2s;
    }
    .btn-outline { background: transparent; border: 1px solid rgba(255,107,0,0.4); color: var(--orange); }
    .btn-outline:hover { background: rgba(255,107,0,0.1); }
    .btn-orange { background: linear-gradient(135deg, var(--orange), #FF8C00); border: none; color: var(--white); }
    .btn-orange:hover { opacity: 0.88; }
    .btn-orange:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-red { background: transparent; border: 1px solid rgba(255,60,60,0.35); color: #ff7070; font-size: 0.78rem; padding: 4px 10px; }
    .btn-red:hover { background: rgba(255,60,60,0.1); }

    /* LAYOUT */
    .layout { display: flex; min-height: calc(100vh - 58px); }

    /* SIDEBAR */
    .sidebar {
      width: 240px; flex-shrink: 0;
      background: rgba(255,255,255,0.02); border-left: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column;
    }
    .sidebar-head {
      padding: 16px 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-title { font-size: 0.78rem; font-weight: 700; color: var(--muted); letter-spacing: 1px; }
    .client-list { flex: 1; overflow-y: auto; }
    .client-item {
      padding: 12px 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    .client-item:hover { background: rgba(255,107,0,0.06); }
    .client-item.active { background: rgba(255,107,0,0.1); border-right: 3px solid var(--orange); }
    .client-item-name { font-size: 0.9rem; font-weight: 700; }
    .client-item-email { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; padding: 24px 28px 60px; }
    .no-select { display: flex; align-items: center; justify-content: center; height: 300px; color: #333; font-size: 1rem; }

    /* SECTION CARD */
    .sec-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px 22px; margin-bottom: 24px;
    }
    .sec-card-title {
      font-size: 1rem; font-weight: 900; color: var(--white);
      margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .sec-card-title span { color: var(--orange); }

    /* FORM GRID */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .form-grid.cols-1 { grid-template-columns: 1fr; }
    @media (max-width: 600px) { .form-grid, .form-grid.cols-3 { grid-template-columns: 1fr; } }
    .f-group { display: flex; flex-direction: column; gap: 5px; }
    .f-group label { font-size: 0.77rem; font-weight: 700; color: var(--muted); }
    .f-group input, .f-group select {
      padding: 9px 12px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 7px;
      color: var(--white); font-family: 'Heebo', sans-serif; font-size: 0.88rem;
      outline: none; transition: border-color 0.2s;
    }
    .f-group input:focus, .f-group select:focus { border-color: var(--orange); }
    .f-group select option { background: #1a1a1a; }

    /* TRAINING EDITOR */
    .day-block { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .day-block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .day-block-head input { flex: 1; padding: 7px 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: var(--white); font-family: 'Heebo', sans-serif; font-size: 0.88rem; outline: none; }
    .day-block-head input:focus { border-color: var(--orange); }
    .muscle-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
    .muscle-pill { padding: 5px 12px; border-radius: 20px; font-family: 'Heebo', sans-serif; font-size: 0.78rem; font-weight: 700; cursor: pointer; white-space: nowrap; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: var(--muted); transition: all 0.15s; }
    .muscle-pill:hover { border-color: rgba(255,107,0,0.4); color: var(--white); }
    .muscle-pill.muscle-active { background: rgba(255,107,0,0.15); border-color: var(--orange); color: var(--orange); }
    .ex-row { display: grid; grid-template-columns: 2fr 1fr 3fr auto; gap: 8px; align-items: center; margin-bottom: 7px; }
    .ex-row input { padding: 7px 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: var(--white); font-family: 'Heebo', sans-serif; font-size: 0.82rem; outline: none; }
    .ex-row input:focus { border-color: rgba(255,107,0,0.5); }
    .ex-row input::placeholder { color: #444; }
    @media (max-width: 640px) { .ex-row { grid-template-columns: 1fr 1fr; } }
    .add-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.8rem; font-weight: 700; color: var(--orange);
      background: none; border: none; cursor: pointer; padding: 4px 0;
      transition: opacity 0.2s; font-family: 'Heebo', sans-serif;
    }
    .add-link:hover { opacity: 0.7; }

    /* NUTRITION EDITOR */
    .meal-block { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .meal-block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .meal-block-head input { flex: 1; padding: 7px 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: var(--white); font-family: 'Heebo', sans-serif; font-size: 0.88rem; outline: none; }
    .meal-block-head input:focus { border-color: var(--orange); }
    .item-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
    .item-row input { padding: 6px 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: var(--white); font-family: 'Heebo', sans-serif; font-size: 0.8rem; outline: none; text-align: center; }
    .item-row input:first-child { text-align: right; }
    .item-row input:focus { border-color: rgba(255,107,0,0.5); }
    .item-row input::placeholder { color: #444; font-size: 0.72rem; }
    @media (max-width: 640px) { .item-row { grid-template-columns: 1fr 1fr 1fr; } }
    .nutri-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr auto; gap: 6px; margin-bottom: 6px; }
    .nutri-header span { font-size: 0.7rem; font-weight: 700; color: var(--muted); text-align: center; padding: 0 2px; }
    .nutri-header span:first-child { text-align: right; }

    /* MODAL */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-bg.open { display: flex; }
    .modal { background: #151515; border: 1px solid rgba(255,107,0,0.35); border-radius: 16px; padding: 28px; width: 100%; max-width: 440px; box-shadow: 0 0 60px rgba(255,107,0,0.15); }
    .modal h3 { font-size: 1.1rem; font-weight: 900; margin-bottom: 20px; }
    .modal h3 span { color: var(--orange); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 10px 22px; border-radius: 8px; font-size: 0.88rem; font-weight: 700;
      z-index: 999; transition: opacity 0.3s; opacity: 0; pointer-events: none;
    }
    .toast.ok  { background: rgba(60,200,60,0.15); border: 1px solid rgba(60,200,60,0.4); color: #70dd70; }
    .toast.err { background: rgba(255,60,60,0.15); border: 1px solid rgba(255,60,60,0.4); color: #ff7070; }
    .toast.show { opacity: 1; }

    /* LOADER */
    #loader { position: fixed; inset: 0; background: var(--black); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .spin { width: 36px; height: 36px; border: 3px solid rgba(255,107,0,0.2); border-top-color: var(--orange); border-radius: 50%; animation: sp 0.7s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }

    /* RECORDS OVERLAY */
    .records-overlay { position: fixed; inset: 0; z-index: 400; background: var(--black); display: none; flex-direction: column; overflow: hidden; }
    .records-overlay.open { display: flex; }
    .rec-hdr { flex-shrink: 0; height: calc(62px + var(--sat,0px)); padding: var(--sat,0px) 18px 0; box-sizing: border-box; background: rgba(9,9,9,0.97); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,215,0,0.2); display: flex; align-items: center; justify-content: space-between; }
    .rec-hdr-title { font-size: 1.1rem; font-weight: 900; background: linear-gradient(135deg,#FFD700,#FF6B00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .btn-close-rec { background: rgba(255,255,255,0.07); border: none; color: var(--muted); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
    .rec-body { flex: 1; overflow-y: auto; padding: 20px 16px 40px; max-width: 700px; margin: 0 auto; width: 100%; }
    .rec-mode-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .rec-tab { padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: var(--muted); font-family:'Heebo',sans-serif; font-size:0.85rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
    .rec-tab.active { background: rgba(255,215,0,0.12); border-color: var(--gold); color: var(--gold); }
    .muscle-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .m-tab { padding: 5px 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: transparent; color: #555; font-family:'Heebo',sans-serif; font-size:0.75rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
    .m-tab.active { background: rgba(255,107,0,0.12); border-color: var(--orange); color: var(--orange); }
    .ex-select { width:100%; padding:12px 14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:var(--white); font-family:'Heebo',sans-serif; font-size:0.95rem; outline:none; cursor:pointer; margin-bottom:20px; }
    .ex-select:focus { border-color: var(--orange); }
    .podium { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
    .podium-row { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); }
    .podium-row.rank-1 { border-color:rgba(255,215,0,0.45); background:rgba(255,215,0,0.06); }
    .podium-row.rank-2 { border-color:rgba(192,192,192,0.3); background:rgba(192,192,192,0.04); }
    .podium-row.rank-3 { border-color:rgba(205,127,50,0.3); background:rgba(205,127,50,0.04); }
    .podium-medal { font-size:1.6rem; flex-shrink:0; width:32px; text-align:center; }
    .podium-info { flex:1; min-width:0; }
    .podium-name { font-size:0.95rem; font-weight:900; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .podium-stats { font-size:0.78rem; color:var(--muted); }
    .podium-orm { font-size:0.9rem; font-weight:700; color:var(--gold); white-space:nowrap; }
    .my-rec-box { padding:13px 16px; border-radius:12px; border:1px solid rgba(255,107,0,0.2); background:rgba(255,107,0,0.05); font-size:0.85rem; color:var(--muted); margin-top:4px; }
    .my-rec-box strong { color:var(--orange); }
    .steps-row { display:flex; gap:10px; margin-bottom:24px; }
    .steps-input { flex:1; padding:12px 14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:var(--white); font-family:'Heebo',sans-serif; font-size:0.95rem; outline:none; }
    .steps-input:focus { border-color: var(--orange); }
    .btn-save-steps { padding:12px 20px; background:var(--orange); border:none; border-radius:10px; color:#fff; font-family:'Heebo',sans-serif; font-size:0.9rem; font-weight:700; cursor:pointer; white-space:nowrap; }
    .no-records { text-align:center; padding:40px 20px; color:#444; font-size:0.9rem; }
    .lib-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
    .lib-tab { padding:6px 14px; border-radius:18px; font-family:'Heebo',sans-serif; font-size:0.8rem; font-weight:700; cursor:pointer; white-space:nowrap; border:1px solid rgba(255,107,0,0.25); background:transparent; color:var(--muted); transition:all 0.2s; }
    .lib-tab:hover { color:var(--white); border-color:rgba(255,107,0,0.5); }
    .lib-tab.active { background:linear-gradient(135deg,var(--orange),#FF8C00); border-color:transparent; color:var(--white); }
    .sets-coach-wrap { margin:8px 0; }
    .sets-coach-head { display:grid; grid-template-columns:28px 72px 1fr 22px; gap:6px; padding:3px 8px; font-size:0.68rem; font-weight:700; color:var(--muted); }
    .sets-coach-row { display:grid; grid-template-columns:28px 72px 1fr 22px; gap:6px; align-items:center; padding:4px 8px; background:rgba(255,255,255,0.02); border-radius:6px; margin-bottom:3px; }
    .sets-coach-row input { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:#fff; font-family:'Heebo',sans-serif; font-size:0.82rem; padding:4px 6px; outline:none; width:100%; text-align:center; }
    .sets-coach-row input:focus { border-color:var(--orange); }
    .sets-coach-range { display:flex; align-items:center; gap:4px; }
    .sets-coach-range input { width:44px !important; }
    .sets-coach-range span { color:var(--muted); font-size:0.75rem; white-space:nowrap; }
    .btn-add-set { font-size:0.75rem; color:var(--orange); background:none; border:1px dashed rgba(255,107,0,0.3); border-radius:6px; padding:4px 12px; cursor:pointer; margin-top:4px; font-family:'Heebo',sans-serif; }
    .btn-add-set:hover { background:rgba(255,107,0,0.08); }
    .ai-box { background:rgba(255,215,0,0.04); border:1px solid rgba(255,215,0,0.2); border-radius:10px; padding:14px 16px; margin-bottom:18px; }
    .ai-box-title { font-size:0.82rem; font-weight:700; color:var(--gold); margin-bottom:10px; }
    .ai-textarea { width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:var(--white); font-family:'Heebo',sans-serif; font-size:0.88rem; padding:10px 12px; resize:vertical; min-height:72px; outline:none; transition:border-color 0.2s; line-height:1.6; }
    .ai-textarea:focus { border-color:var(--gold); }
    .ai-status { font-size:0.78rem; color:var(--muted); margin-right:10px; }
    /* ── File attachment UI ── */
    .ai-attach-row { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
    .btn-attach { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); border-radius:8px; color:var(--muted); font-family:'Heebo',sans-serif; font-size:0.77rem; font-weight:700; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .btn-attach:hover { border-color:rgba(255,107,0,0.4); color:var(--orange); background:rgba(255,107,0,0.05); }
    .btn-attach.has-file { border-color:rgba(74,222,128,0.4); color:#4ade80; background:rgba(74,222,128,0.05); }
    .attach-filename { font-size:0.74rem; color:#4ade80; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
    .btn-attach-clr { background:none; border:none; color:#555; cursor:pointer; font-size:0.82rem; padding:2px 6px; border-radius:4px; transition:color 0.2s; flex-shrink:0; }
    .btn-attach-clr:hover { color:#ff7070; }
    .meal-alts { margin-top:12px; padding:10px 14px; background:rgba(60,180,255,0.04); border:1px solid rgba(60,180,255,0.18); border-radius:8px; }
    .meal-alts-row { display:flex; align-items:flex-start; gap:8px; margin-bottom:5px; flex-wrap:wrap; font-size:0.77rem; }
    .meal-alts-row:last-child { margin-bottom:0; }
    .alt-label { font-weight:700; color:#60b4ff; flex-shrink:0; min-width:60px; }
    .alt-pill { display:inline-block; padding:3px 10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#ccc; margin:2px; cursor:pointer; transition:background 0.15s,border-color 0.15s,color 0.15s; }
    .alt-pill:hover { background:rgba(255,107,0,0.12); border-color:rgba(255,107,0,0.4); color:#fff; }

    .btn-mob-menu { display:none; align-items:center; gap:5px; background:rgba(255,107,0,0.1); border:1px solid rgba(255,107,0,0.3); border-radius:6px; color:var(--orange); padding:7px 10px; font-family:'Heebo',sans-serif; font-size:0.78rem; font-weight:700; cursor:pointer; white-space:nowrap; }
    .sidebar-bd { display:none; position:fixed; inset:0; top:calc(58px + var(--sat,0px)); background:rgba(0,0,0,0.65); z-index:140; }
    .sidebar-bd.open { display:block; }

    @media (max-width: 768px) {
      .layout { display:block; }
      .sidebar { position:fixed; right:0; top:calc(58px + var(--sat,0px)); height:calc(100dvh - 58px - var(--sat,0px)); width:280px; z-index:150; transform:translateX(110%); transition:transform 0.3s ease; box-shadow:-6px 0 24px rgba(0,0,0,0.6); }
      .sidebar.mob-open { transform:translateX(0); }
      .main { padding:16px 14px 60px; width:100%; }
      .btn-mob-menu { display:flex; }
      .topnav { padding:0 10px; flex-wrap:wrap; height:auto; min-height:58px; }
      .topnav-sub { display:none; }
      .topnav-brand { font-size:1rem; }
      .btn-sm { padding:5px 7px; font-size:0.7rem; }
      .sec-card { padding:16px 12px; }
      .form-grid { grid-template-columns:1fr 1fr; }
      .ex-row { grid-template-columns:1fr 1fr; }
      .item-row { grid-template-columns:1fr 1fr 1fr; }
      .nutri-header { grid-template-columns:1fr 1fr 1fr; }
      .nutri-header span:nth-child(n+4) { display:none; }
    }
    @media (max-width: 480px) {
      .form-grid, .form-grid.cols-3 { grid-template-columns:1fr; }

      /* Topnav: tighter on tiny phones */
      .topnav { gap:4px; padding:6px 8px; }
      .btn-sm { padding:4px 6px; font-size:0.65rem; }

  /* ── getMergedFoodList: Supabase + מה שחסר מ-FOOD_DB_LOCAL ── */
  function getMergedFoodList() {
    if (!allFoodItems.length) return FOOD_DB_LOCAL;
    const valid = allFoodItems.filter(f => f.calories > 0);
    const names = new Set(valid.map(f => f.name));
    return [...valid, ...FOOD_DB_LOCAL.filter(f => !names.has(f.name))];
  }

  /* ── macroScore: דמיון יחס מאקרו בין פריט קיים לאלטרנטיבה (0–1) ── */
  function macroScore(refItem, cand) {
    if (!cand || !cand.calories || !refItem) return 0;
    const rp = +(refItem.protein||0)*4, rc = +(refItem.carbs||0)*4, rf = +(refItem.fat||0)*9;
    const rT = rp + rc + rf || 1;
    const cp = +(cand.protein||0)*4,  cc = +(cand.carbs||0)*4,  cf = +(cand.fat||0)*9;
    const cT = cp + cc + cf || 1;
    const dist = Math.abs(rp/rT - cp/cT) + Math.abs(rc/rT - cc/cT) + Math.abs(rf/rT - cf/cT);
    return Math.max(0, 1 - dist / 1.5);
  }

  /* ── getChipOptions: עד 5 חלופות מהמאגר בלבד ── */
  function getChipOptions(mi, category) {
    const meal = nutritionPlan[mi];
    if (!meal || !(meal.items||[]).length) return [];
    const ref = getDominantItem(mi, category);
    if (!ref || !ref.calories) return [];
    const refName = ref.food || ref.name || '';
    /* רק פריטים מהמאגר — מבטיח שיש ערכים תזונתיים לתצוגת ההשוואה */
    return getMergedFoodList()
      .filter(fd => {
        if (fd.name === refName) return false;
        if (category === 'protein') return (fd.protein||0) > 10;
        if (category === 'carbs')   return (fd.carbs||0)   > 20;
        return                             (fd.fat||0)      > 10;
      })
      .map(fd => ({name: fd.name, score: macroScore(ref, fd)}))
      .filter(fd => fd.score > 0.35)
      .sort((a,b) => b.score - a.score)
      .slice(0, 5)
      .map(fd => fd.name);
  }

  /* ── עזרי חלופות ── */
  function getDominantItem(mi, category) {
    const items = (nutritionPlan[mi]?.items) || [];
    let target = null, maxVal = -1;
    items.forEach(item => {
      const val = category==='protein'?(+item.protein||0):category==='carbs'?(+item.carbs||0):(+item.fat||0);
      if (val > maxVal) { maxVal = val; target = item; }
    });
    return target;
  }
  function getDominantItemIdx(mi, category) {
    const items = (nutritionPlan[mi]?.items) || [];
    let idx = 0, maxVal = -1;
    items.forEach((item,i) => {
      const val = category==='protein'?(+item.protein||0):category==='carbs'?(+item.carbs||0):(+item.fat||0);
      if (val > maxVal) { maxVal = val; idx = i; }

    return idx;
  }
  /* יחיד / רבים ביחידות מידה */
  const UNIT_PLURAL = {

  function unitDisplay(name, qty) {
    if (qty <= 1) return name;
    return UNIT_PLURAL[name] || name;
  }

  function formatChipQty(foodName, refCalories) {
    if (!refCalories) return '';
    const af = findFood(foodName);
    if (!af || !af.calories) return '';
    const eqG = Math.round(refCalories / af.calories * 100);
    let specific = FOOD_UNITS_MAP[foodName];
    if (!specific) {
      const key = Object.keys(FOOD_UNITS_MAP).find(k => foodName.startsWith(k));
      specific = key ? FOOD_UNITS_MAP[key] : null;
    }
    if (!specific) return `${eqG}g`;
    const units = specific.filter(u => u.name !== 'גרם' && u.grams >= 5);
    for (const u of units) {
      const qty = eqG / u.grams;
      if (qty >= 0.5 && qty <= 6) {
        const n = Math.round(qty * 2) / 2;
        return `${n} ${unitDisplay(u.name, n)}`;
      }
    }
    return `${eqG}g`;
  }
  function addAltFromChip(mi, foodName, category) {
    const meal = nutritionPlan[mi];
    if (!meal) return;
    const ii = getDominantItemIdx(mi, category);
    const item = (meal.items||[])[ii];
    if (!item) return;
    if (!item.alternatives) item.alternatives = [];
    if (item.alternatives.some(a => a.name === foodName)) { toast(foodName + ' כבר בחלופות', 'err'); return; }
    const af = findFood(foodName);

  function getUnitsForFood(foodName) {
    const specific = FOOD_UNITS_MAP[foodName] || [];
    if (!specific.length) return GENERIC_UNITS;

    const item = nutritionPlan[mi].items[ii];
    item.quantity = val;
    const m = String(val).match(/([\d.]+)/);
    if (!m) return;
    const num = parseFloat(m[1]);
    if (!num) return;
    item._unit = item._unit || 'גרם';
    item._qty  = num;
    recalcItemMacros(mi, ii);

      else if (inp.placeholder === 'F')   inp.value = item.fat      || '';
    });

  function recalcItemMacros(mi, ii) {
    const item = nutritionPlan[mi].items[ii];
    const food = findFood(item.food);
    if (!food) return;
    const units = getUnitsForFood(item.food);
    const unit = units.find(u => u.name === item._unit) || { grams: 1 };
    const grams = (item._qty || 1) * unit.grams;
    const r = grams / 100;
    item.calories = Math.round(food.calories * r * 10) / 10;
    item.protein  = Math.round(food.protein  * r * 10) / 10;
    item.carbs    = Math.round(food.carbs    * r * 10) / 10;
    item.fat      = Math.round(food.fat      * r * 10) / 10;
    item.quantity = item._unit === 'גרם'
      ? `${Math.round(grams)} גרם`
      : `${item._qty} ${item._unit} (${Math.round(grams)}g)`;

     עדיין" — הודעה שנראית כמו מחיקת נתונים. */
  let coachesErr = null;
  /* PGRST303 = הטוקן נחתם בעתיד לפי שעון המסד, PGRST301 = לא ניתן
     לפענוח, 401 = נדחה. שלושתם "הטוקן פסול", לא "אין נתונים". */
  const isAuthErr = (e) => {
    if (!e) return false;
    const c = String(e.code || '');
    return c === 'PGRST303' || c === 'PGRST301' || c === 'PGRST302' || e.status === 401;
  };
  /* התחברות מחדש מנקה את הטוקן הפסול. reload לא יעזור כאן. */
  window.fjRelogin = async () => {
    try { await sb.auth.signOut({ scope: 'local' }); } catch (_) { }
    try {
      Object.keys(localStorage).filter(k => k.indexOf('sb-') === 0)
        .forEach(k => localStorage.removeItem(k));

    location.href = 'login.html';

  /* פענוח מקומי של הטוקן. base64url אינו base64: יש להחליף
     את התווים לפני atob. שום דבר כאן לא נשלח לשום מקום. */
  const fjTokenDiag = async () => {
    try {
      const s = (await sb.auth.getSession()).data.session;
      if (!s || !s.access_token) return 'no-session';
      const part = (i) => JSON.parse(atob(s.access_token.split('.')[i]
        .replace(/-/g, '+').replace(/_/g, '/')));
      const h = part(0), p = part(1);
      const now = Math.floor(Date.now() / 1000);
      return 'alg=' + h.alg + ' kid=' + String(h.kid || '-').slice(0, 8) +
        ' iat=' + p.iat + ' now=' + now + ' delta=' + (p.iat - now) + 's' +
        ' exp_in=' + (p.exp - now) + 's role=' + (p.role || '-');
    } catch (e) { return 'diag:' + String((e && e.message) || e).slice(0, 60); }
  };

    const done = shopOrders.filter(o => ['paid', 'shipped'].includes(o.status));
    const wait = shopOrders.filter(o => o.status === 'submitted');
    const sum = (arr, f) => arr.reduce((s, o) => s + f(o), 0);
    const rev  = sum(done, o => Number(o.product_price || 0) * (o.qty || 1));
    const prof = sum(done, o => (Number(o.product_price || 0) - Number(o.product_cost || 0)) * (o.qty || 1));

  async function ordSet(id, status) {
    const patch = { status };
    if (status === 'submitted' && !shopOrders.find(o => o.id === id)?.submitted_at)
      patch.submitted_at = new Date().toISOString();
    const { error } = await sb.from('shop_orders').update(patch).eq('id', id);
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }
    await loadOrders();
    toast('ההזמנה עודכנה ✓', 'ok');
  }

  async function loadShopProducts() {
    const box = document.getElementById('shop-list'); if (!box) return;
    const { data, error } = await sb.from('shop_products').select('*').order('sort_order').order('created_at');
    if (error) {
      box.innerHTML = `<div style="color:#ff7070;padding:14px;font-size:0.82rem;">
        שגיאה בטעינה: ${esc(error.message)}<br>
        <span style="color:#888;">אם הטבלה עדיין לא קיימת — הרץ את המיגרציה 2026-08-14_shop_products.sql</span></div>`;
      return;
    }
    shopProducts = data || [];
    if (!shopProducts.length) {
      box.innerHTML = `<div style="color:#666;padding:22px;text-align:center;font-size:0.85rem;">

      return;

    box.innerHTML = shopProducts.map(p => `

        ${p.image_url

          : `<div style="width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,0.05);display:grid;place-items:center;flex-shrink:0;">🧪</div>`}
        <div style="flex:1;min-width:140px;">
          <div style="font-weight:800;color:#fff;font-size:0.88rem;">${esc(p.name)}
            ${p.tag ? `<span style="font-size:0.66rem;color:#3FD3E8;">· ${esc(p.tag)}</span>` : ''}
            ${p.visible ? '' : '<span style="font-size:0.66rem;color:#888;">· טיוטה</span>'}
            ${p.in_stock === false ? '<span style="font-size:0.66rem;color:#f0a24b;">· אזל</span>' : ''}</div>
          <div style="font-size:0.74rem;color:#888;">${esc(p.category || '—')}${p.spec ? ' · ' + esc(p.spec) : ''}${
            p.price != null && p.cost != null
              ? ` · <span style="color:#4ade80;">רווח ${(Number(p.price) - Number(p.cost)).toLocaleString('he-IL')} ₪</span>`
              : p.price != null ? ' · <span style="color:#f0a24b;" title="בלי עלות, העמלה תחושב מהמחיר המלא">⚠ אין עלות</span>' : ''}</div>
        </div>
        <div style="font-weight:900;color:#3FD3E8;font-size:0.95rem;">${p.price != null ? Number(p.price).toLocaleString('he-IL') + ' ₪' : 'לפרטים'}</div>
        <div style="display:flex;gap:5px;">
          <button class="btn-sm btn-outline" style="font-size:0.68rem;" onclick="shopEdit(${p.id})">✎</button>
          <button class="btn-sm btn-outline" style="font-size:0.68rem;" onclick="shopToggleVisible(${p.id})" title="${p.visible ? 'הסתר מהחנות' : 'הצג בחנות'}">${p.visible ? '👁' : '🙈'}</button>

  function shopEdit(id) {
    const p = id ? shopProducts.find(x => x.id === id) || {} : {};
    _shopEdit = id;
    const f = (lbl, el) => `<div class="f-group"><label>${lbl}</label>${el}</div>`;
    const inp = (id2, v, ph = '', type = 'text') =>
      `<input id="${id2}" type="${type}" value="${esc(v == null ? '' : String(v))}" placeholder="${esc(ph)}"/>`;
    document.getElementById('shop-modal-body').innerHTML = `
      <div style="font-weight:900;font-size:1.05rem;color:#3FD3E8;margin-bottom:14px;">${id ? 'עריכת מוצר' : 'מוצר חדש'}</div>

      ${f('תיאור', `<textarea id="sp-desc" rows="3" placeholder="תיאור קצר של המוצר">${esc(p.description || '')}</textarea>`)}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        ${f('מחיר (₪)', inp('sp-price', p.price, 'ריק = לפרטים', 'number'))}
        ${f('מחיר קודם', inp('sp-was', p.was_price, 'יוצג מחוק', 'number'))}
      </div>
      <!-- העלות אינה מוצגת ללקוח. היא הבסיס לרווח, וממנו נגזרת
           עמלת הפרזנטור — בלעדיה העמלה מחושבת מהמחיר המלא. -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;">
        ${f('העלות שלי (₪)', inp('sp-cost', p.cost, 'כמה המוצר עולה לך', 'number'))}
        <div class="f-group"><label>רווח למכירה</label>
          <div id="sp-profit" style="padding:9px 12px;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);border-radius:8px;color:#4ade80;font-weight:800;">—</div></div>
      </div>
      <div id="sp-comm-hint" style="font-size:0.74rem;color:#888;margin:-4px 0 10px;"></div>
      ${f('תמונה', `
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <input id="sp-img" value="${esc(p.image_url || '')}" placeholder="קישור לתמונה, או העלה קובץ" style="flex:1;min-width:150px;"/>
          <input type="file" id="sp-file" accept="image/*" style="display:none;" onchange="uploadShopImage(this.files[0])"/>
          <button class="btn-sm btn-outline" style="font-size:0.7rem;" onclick="document.getElementById('sp-file').click()">📷 העלה</button>
        </div>
        <img id="sp-preview" src="${esc(p.image_url || '')}" style="${p.image_url ? '' : 'display:none;'}margin-top:8px;width:110px;height:82px;object-fit:cover;border-radius:9px;" onerror="this.style.display='none'"/>`)}
      <div style="display:flex;gap:16px;margin:12px 0;flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:6px;font-size:0.82rem;cursor:pointer;">
          <input type="checkbox" id="sp-stock" ${p.in_stock === false ? '' : 'checked'}/> במלאי</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:0.82rem;cursor:pointer;">
          <input type="checkbox" id="sp-vis" ${p.visible === false ? '' : 'checked'}/> מוצג בחנות</label>
        <div style="display:flex;align-items:center;gap:6px;font-size:0.82rem;">
          סדר: <input id="sp-sort" type="number" value="${p.sort_order || 0}" style="width:64px;"/></div>
      </div>
      <div id="sp-status" style="font-size:0.8rem;margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn-sm btn-orange" id="sp-save" style="flex:1;" onclick="shopSave()">💾 שמור</button>
        <button class="btn-sm btn-outline" onclick="closeShopModal()">ביטול</button>
      </div>`;
    document.getElementById('shop-modal').style.display = 'flex';
    ['sp-price', 'sp-cost'].forEach(id =>
      document.getElementById(id)?.addEventListener('input', shopProfitPreview));
    shopProfitPreview();
  }
  /* מציג את הרווח בזמן ההקלדה, ולצדו כמה תעלה עמלת הפרזנטור הגבוה
     ביותר — כדי שהמחיר ייקבע מתוך ידיעה ולא בדיעבד. */
  function shopProfitPreview() {
    const num = id => { const v = document.getElementById(id)?.value.trim(); return v === '' || v == null ? null : Number(v); };
    const price = num('sp-price'), cost = num('sp-cost');
    const box = document.getElementById('sp-profit'), hint = document.getElementById('sp-comm-hint');
    if (!box) return;
    if (price == null) { box.textContent = '—'; if (hint) hint.textContent = ''; return; }
    if (cost == null) {
      box.textContent = 'לא ידוע';
      box.style.color = '#f0a24b';
      if (hint) hint.textContent = '⚠ בלי עלות, עמלת הפרזנטור תחושב מהמחיר המלא.';
      return;
    }
    const profit = price - cost;
    box.style.color = profit >= 0 ? '#4ade80' : '#f87171';
    box.textContent = profit.toLocaleString('he-IL') + ' ₪' +
      (price > 0 ? `  (${Math.round(profit / price * 100)}%)` : '');
    const top = Math.max(0, ...presentersList.filter(x => x.active).map(x => Number(x.pct || 0)));
    if (hint) hint.textContent = profit < 0
      ? '⚠ העלות גבוהה מהמחיר — כל מכירה תפסיד.'
      : top > 0 ? `עמלה בשיעור ${top}% (הגבוה ביותר): ${(Math.round(profit * top) / 100).toLocaleString('he-IL')} ₪ · נשאר לך ${(profit - Math.round(profit * top) / 100).toLocaleString('he-IL')} ₪`
                : '';
  }
  function closeShopModal() { document.getElementById('shop-modal').style.display = 'none'; }

  async function uploadShopImage(file) {
    if (!file) return;
    const st = document.getElementById('sp-status');
    st.textContent = '⏳ מעלה תמונה...'; st.style.color = 'var(--muted)';
    try {
      /* שם הקובץ נבנה ממזהה ולא משם המוצר: Storage דוחה מפתחות
         שאינם ASCII, ושמות המוצרים בעברית. */
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      const path = `shop/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;
      const { error } = await sb.storage.from('coach-assets').upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' });
      if (error) throw error;
      const { data } = sb.storage.from('coach-assets').getPublicUrl(path);
      document.getElementById('sp-img').value = data.publicUrl;
      const pv = document.getElementById('sp-preview');
      pv.src = data.publicUrl; pv.style.display = 'block';
      st.textContent = '✓ התמונה הועלתה'; st.style.color = '#4ade80';
    } catch (e) {
      st.textContent = 'שגיאה בהעלאה: ' + (e.message || e) + ' — אפשר להדביק קישור במקום';
      st.style.color = '#ff7070';
    }
  }

  async function shopSave() {
    const v = id => document.getElementById(id).value.trim();
    const num = id => { const x = v(id); return x === '' ? null : Number(x); };
    const st = document.getElementById('sp-status');
    const name = v('sp-name');
    if (!name) { st.textContent = 'יש להזין שם מוצר'; st.style.color = '#ff7070'; return; }
    const row = {
      name, category: v('sp-cat') || null, description: v('sp-desc') || null,
      spec: v('sp-spec') || null, price: num('sp-price'), was_price: num('sp-was'),
      cost: num('sp-cost'),
      image_url: v('sp-img') || null, tag: v('sp-tag') || null,
      in_stock: document.getElementById('sp-stock').checked,
      visible: document.getElementById('sp-vis').checked,
      sort_order: num('sp-sort') || 0,
    };
    const btn = document.getElementById('sp-save'); btn.disabled = true; btn.textContent = 'שומר...';
    const { error } = _shopEdit
      ? await sb.from('shop_products').update(row).eq('id', _shopEdit)
      : await sb.from('shop_products').insert(row);
    btn.disabled = false; btn.textContent = '💾 שמור';
    if (error) { st.textContent = 'שגיאה: ' + error.message; st.style.color = '#ff7070'; return; }
    closeShopModal();
    await loadShopProducts();
    toast(_shopEdit ? 'המוצר עודכן ✓' : 'המוצר נוסף לקטלוג ✓', 'ok');
  }

  async function shopToggleVisible(id) {
    const p = shopProducts.find(x => x.id === id); if (!p) return;
    const { error } = await sb.from('shop_products').update({ visible: !p.visible }).eq('id', id);
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }
    await loadShopProducts();
    toast(p.visible ? 'המוצר הוסתר מהחנות' : 'המוצר מוצג בחנות ✓', 'ok');
  }

  async function shopDelete(id) {
    const p = shopProducts.find(x => x.id === id); if (!p) return;
    if (!confirm(`למחוק את "${p.name}" מהקטלוג?\nהפעולה אינה הפיכה.`)) return;
    const { error } = await sb.from('shop_products').delete().eq('id', id);
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }
    await loadShopProducts();
    toast('המוצר נמחק', 'ok');
  }

  function caRow(r) {

  function renderPresenterCard(p) {
    const refs = _presReferrals.filter(r => r.presenter_email === p.email);
    const firstPct = +p.presenter_first_pct || 0, recPct = +p.presenter_recurring_pct || 0, recType = p.presenter_recurring_type || 'cash';
    const commOf = pay => {
      const pct = pay.kind === 'first' ? firstPct : recPct;

      return `<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:9px 11px;margin-bottom:7px;">

          <div style="font-size:0.8rem;color:#4ade80;font-weight:800;">נכנס: ${_presFmt(moneyIn)} ₪</div>

          <select id="ppay-kind-${r.id}" style="padding:5px 7px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-family:'Heebo',sans-serif;font-size:0.75rem;"><option value="first">חבילה ראשונה</option><option value="recurring">חודש המשך</option></select>
          <input id="ppay-month-${r.id}" type="month" value="${_presMonth}" style="padding:5px 7px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-family:'Heebo',sans-serif;font-size:0.75rem;"/>

  async function addPresenter() {
    const email = document.getElementById('pres-add-sel')?.value; if (!email) return;
    const { error } = await sb.from('coaches').update({ is_presenter: true }).eq('email', email);
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }
    toast('הוגדר כפרזנטור ✓', 'ok'); openPresentersView();
  }
  async function removePresenter(email) {
    if (!confirm('לבטל את הפרזנטור? (הנתונים שנצברו יישמרו)')) return;
    await sb.from('coaches').update({ is_presenter: false }).eq('email', email);
    openPresentersView();
  }
  async function savePresenterConfig(id, email) {
    const free  = document.getElementById('pcfg-free-' + id)?.value || null;
    const first = parseFloat(document.getElementById('pcfg-first-' + id)?.value) || 0;
    const rec   = parseFloat(document.getElementById('pcfg-rec-' + id)?.value) || 0;
    const type  = document.getElementById('pcfg-type-' + id)?.value || 'cash';
    const patch = { presenter_free_until: free, presenter_first_pct: first, presenter_recurring_pct: rec, presenter_recurring_type: type };
    if (free) patch.premium_until = free; // 🎁 free panel = free premium until that date
    const { error } = await sb.from('coaches').update(patch).eq('email', email);
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }
    toast('הגדרות פרזנטור נשמרו ✓', 'ok'); openPresentersView();
  }
  async function addPresenterReferral(id, presEmail) {
    const name = document.getElementById('pref-name-' + id)?.value.trim();
    const email = document.getElementById('pref-email-' + id)?.value.trim().toLowerCase();
    if (!email) { toast('הזן אימייל', 'err'); return; }
    const { error } = await sb.from('presenter_referrals').insert({ presenter_email: presEmail, referred_name: name || null, referred_email: email });
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }
    openPresentersView();
  }
  async function deletePresenterReferral(rid) {
    if (!confirm('להסיר את איש הקשר וכל התשלומים שלו?')) return;
    const ref = _presReferrals.find(r => r.id === rid);
    if (ref) await sb.from('presenter_payments').delete().eq('presenter_email', ref.presenter_email).eq('referred_email', ref.referred_email);
    await sb.from('presenter_referrals').delete().eq('id', rid);
    openPresentersView();
  }
  async function addPresenterPayment(presEmail, refEmail, rid) {
    const amount = parseFloat(document.getElementById('ppay-amt-' + rid)?.value);
    const kind = document.getElementById('ppay-kind-' + rid)?.value || 'recurring';
    const month = document.getElementById('ppay-month-' + rid)?.value;
    if (!amount || amount <= 0) { toast('הזן סכום', 'err'); return; }
    const payMonth = (month || _presMonth) + '-01';
    const { error } = await sb.from('presenter_payments').insert({ presenter_email: presEmail, referred_email: refEmail, amount, kind, pay_month: payMonth });
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }
    openPresentersView();
  }
  async function deletePresenterPayment(pid) {
    await sb.from('presenter_payments').delete().eq('id', pid);
    openPresentersView();
  }

            <div>
              <div style="font-size:0.92rem;font-weight:900;">${esc(c.name)}</div>

  // אישור מאמן ממתין → מאמן רגיל (צפייה בלבד). שדרוג ל-בכיר נעשה דרך כפתורי הרישיון.
  async function approvePendingCoach(id) {
    const { error } = await sb.from('coaches').update({ role: 'regular' }).eq('id', id);
    if (error) { toast('שגיאה באישור: ' + error.message, 'err'); return; }
    const c = coachesList.find(x => x.id === id);
    if (c) c.role = 'regular';
    toast('המאמן אושר כמאמן רגיל (צפייה) ✓', 'ok');
    renderPendingCoaches();
    renderCoachesTable();

  async function rejectCoach(id, name) {
    if (!confirm(`למחוק את ${name} לגמרי מהמערכת?`)) return;
    await sb.from('coaches').delete().eq('id', id);
    coachesList = coachesList.filter(c => c.id !== id);
    toast('נמחק', 'ok');

    renderCoachesTable();

  const coachExpanded = {};
  const ROLE_BG    = {regular:'rgba(255,255,255,0.07)',senior:'rgba(255,215,0,0.14)',admin:'rgba(255,107,0,0.16)',studio_owner:'rgba(255,215,0,0.14)'};
  const ROLE_CLR   = {regular:'#888',senior:'#FFD700',admin:'#FF6B00',studio_owner:'#FFD700'};

  /* ══════════════════════════════════════════════════════
     FEATURE 5 — ACQUISITION SOURCE ("איך הגיעו אלינו")
     coaches: friend | sponsor | ads   ·   clients: friend | instagram | gym
  ══════════════════════════════════════════════════════ */
  const ACQ_COACH  = { friend:'🤝 חבר מביא חבר', sponsor:'🎤 דרך ספונסר', ads:'📢 פרסומת ממומנת' };
  const ACQ_CLIENT = { friend:'🤝 חבר מביא חבר', instagram:'📸 פנייה באינסטגרם', gym:'🏋️ פנייה פיזית במכון' };
  const ACQ_CLR    = { friend:'#4ade80', sponsor:'#FFD700', ads:'#60a5fa', instagram:'#f472b6', gym:'#a78bfa', none:'#555' };
  let _acqExpand = {}, _acqClients = [];

  async function loadPresReferralsOnce() {
    if (_presReferrals.length) return;
    const { data } = await sb.from('presenter_referrals').select('*');
    _presReferrals = data || [];
  }

  /* An explicit acq_source always wins. When the admin never set one we can still
     attribute from data already in the system: a referral code proves coach→coach,
     a presenter_referrals row proves sponsor. */
  function deriveCoachAcq(c) {
    if (c.acq_source) return { source: c.acq_source, ref: c.acq_ref || null, derived: false };
    if (c.referred_by_code) {
      const referrer = coachesList.find(x => x.referral_code && x.referral_code === c.referred_by_code);
      return { source: 'friend', ref: referrer ? referrer.email : null, derived: true };
    }
    const email = (c.email || '').toLowerCase();
    const pr = _presReferrals.find(r => (r.referred_email || '').toLowerCase() === email);
    if (pr) return { source: 'sponsor', ref: pr.presenter_email, derived: true };
    return { source: null, ref: null, derived: false };
  }

  /* the "דרך הגעה" row inside an expanded coach card */
  function coachAcqHtml(c) {
    const a = deriveCoachAcq(c);
    const opts = ['', ...Object.keys(ACQ_COACH)].map(k =>
      `<option value="${k}" ${a.source === (k || null) || (!a.source && !k) ? 'selected' : ''}>${k ? ACQ_COACH[k] : '— לא צוין —'}</option>`
    ).join('');

    let refPicker = '';
    if (a.source === 'sponsor') {
      const sponsors = coachesList.filter(x => x.is_presenter);
      refPicker = `<select onclick="event.stopPropagation()" onchange="saveCoachAcq('${c.id}','${esc(c.email)}','acq_ref',this.value)"
        style="background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.25);border-radius:6px;color:#fff;font-family:'Heebo',sans-serif;font-size:0.76rem;padding:4px 8px;outline:none;cursor:pointer;">
        <option value="">— איזה ספונסר? —</option>
        ${sponsors.map(s => `<option value="${esc(s.email)}" ${a.ref === s.email ? 'selected' : ''}>${esc(s.name || s.email)}</option>`).join('')}
      </select>`;
    } else if (a.source === 'friend') {
      const others = coachesList.filter(x => x.email !== c.email && x.role && x.role !== 'pending');
      refPicker = `<select onclick="event.stopPropagation()" onchange="saveCoachAcq('${c.id}','${esc(c.email)}','acq_ref',this.value)"
        style="background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.25);border-radius:6px;color:#fff;font-family:'Heebo',sans-serif;font-size:0.76rem;padding:4px 8px;outline:none;cursor:pointer;">
        <option value="">— מי הזמין? —</option>
        ${others.map(s => `<option value="${esc(s.email)}" ${a.ref === s.email ? 'selected' : ''}>${esc(s.name || s.email)}</option>`).join('')}
      </select>`;
    }

    const derivedNote = a.derived
      ? `<span style="font-size:0.65rem;color:#888;">(זוהה אוטומטית — בחר כדי לקבע)</span>` : '';

    return `<div style="padding:8px 14px 10px;border-top:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div style="font-size:0.72rem;color:var(--muted);font-weight:700;">דרך הגעה:</div>
      <select onclick="event.stopPropagation()" onchange="saveCoachAcq('${c.id}','${esc(c.email)}','acq_source',this.value)"
        style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-family:'Heebo',sans-serif;font-size:0.78rem;padding:4px 8px;outline:none;cursor:pointer;">
        ${opts}
      </select>
      ${refPicker}
      ${derivedNote}
    </div>`;
  }

  async function saveCoachAcq(id, email, field, value) {
    const patch = {};
    patch[field] = value || null;
    // committing a derived channel? persist the attribution alongside it
    const c = coachesList.find(x => x.id == id);
    if (field === 'acq_source' && c) {
      const a = deriveCoachAcq(c);
      if (a.derived && a.ref && value === a.source) patch.acq_ref = a.ref;
      if (value !== 'sponsor' && value !== 'friend') patch.acq_ref = null;
    }
    const { error } = await sb.from('coaches').update(patch).eq('email', email);
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }
    if (c) Object.assign(c, patch);
    toast('✓ דרך הגעה נשמרה', 'ok');
    renderCoachesTable();
  }

  /* ── the stats view ── */
  async function openAcquisitionView() {
    activeEmail = null;
    if (typeof exercisesMode !== 'undefined') exercisesMode = false;
    if (typeof recipesMode !== 'undefined') recipesMode = false;
    renderSidebar();
    document.getElementById('main-area').innerHTML = '<div class="sec-card"><div style="color:#555;padding:20px;">טוען דרכי הגעה...</div></div>';
    const [{ data: cs }, { data: cl }] = await Promise.all([
      sb.from('coaches').select('*').order('name'),
      sb.from('clients').select('email,name,coach_email,acq_source'),
    ]);
    coachesList = cs || [];
    _acqClients = cl || [];   // kept separate — the global `clients` holds full rows
    await loadPresReferralsOnce();
    renderAcquisition();
  }

  function toggleAcq(key) { _acqExpand[key] = !_acqExpand[key]; renderAcquisition(); }

  function acqBar(label, count, total, color, extra) {
    const pct = total ? Math.round(count / total * 1000) / 10 : 0;
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;font-size:0.82rem;margin-bottom:4px;">
        <span style="font-weight:700;">${label}</span>
        <span style="color:${color};font-weight:900;">${count}</span>
        <span style="color:var(--muted);font-size:0.76rem;">(${pct}%)</span>
        ${extra || ''}
      </div>
      <div style="height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${color};border-radius:4px;transition:width 0.3s;"></div>
      </div>
    </div>`;
  }

  function renderAcquisition() {
    const main = document.getElementById('main-area'); if (!main) return;

    // ── coaches: how each coach reached us ──
    const realCoaches = coachesList.filter(c => c.role && c.role !== 'pending');
    const coachTotal = realCoaches.length;
    const byChannel = { friend: [], sponsor: [], ads: [], none: [] };
    realCoaches.forEach(c => {
      const a = deriveCoachAcq(c);
      const k = a.source && byChannel[a.source] ? a.source : 'none';
      byChannel[k].push({ c, ref: a.ref });
    });

    // sponsors table — how many each sponsor brought
    const sponsorCounts = {};
    byChannel.sponsor.forEach(x => {
      const k = x.ref || '—';
      (sponsorCounts[k] = sponsorCounts[k] || []).push(x.c);
    });
    const sponsorRows = Object.entries(sponsorCounts).sort((a, b) => b[1].length - a[1].length);

    // friend table — top 10 inviting coaches
    const inviterCounts = {};
    byChannel.friend.forEach(x => {
      const k = x.ref || '—';
      (inviterCounts[k] = inviterCounts[k] || []).push(x.c);
    });
    const inviterRows = Object.entries(inviterCounts).sort((a, b) => b[1].length - a[1].length).slice(0, 10);

    const nameOf = email => {
      if (!email || email === '—') return '<span style="color:#666;">לא שויך</span>';
      const c = coachesList.find(x => x.email === email);
      return esc(c ? (c.name || email) : email);
    };

    const tableWrap = (rows, emptyMsg, headLabel) => rows.length ? `
      <div style="margin:6px 0 14px;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;">
        <div style="display:grid;grid-template-columns:32px 1fr 70px;gap:8px;padding:7px 12px;background:rgba(255,255,255,0.04);font-size:0.7rem;font-weight:700;color:var(--muted);">
          <div>#</div><div>${headLabel}</div><div style="text-align:center;">כמות</div>
        </div>
        ${rows.map(([email, list], i) => `
          <div style="display:grid;grid-template-columns:32px 1fr 70px;gap:8px;padding:8px 12px;border-top:1px solid rgba(255,255,255,0.05);font-size:0.82rem;align-items:center;">
            <div style="color:${i === 0 ? '#FFD700' : '#666'};font-weight:900;">${i + 1}</div>
            <div>${nameOf(email)}<div style="font-size:0.68rem;color:#666;margin-top:1px;">${list.map(c => esc(c.name || c.email)).join(' · ')}</div></div>
            <div style="text-align:center;font-weight:900;color:var(--orange);">${list.length}</div>
          </div>`).join('')}
      </div>` : `<div style="font-size:0.78rem;color:#555;padding:6px 0 14px;">${emptyMsg}</div>`;

    const arrow = k => `<button onclick="toggleAcq('${k}')" style="margin-right:auto;background:none;border:none;color:var(--orange);cursor:pointer;font-size:0.8rem;font-family:'Heebo',sans-serif;">${_acqExpand[k] ? '▲ סגור' : '▼ פירוט'}</button>`;

    // ── clients: how each trainee reached their coach ──
    const clientTotal = _acqClients.length;
    const clientCounts = { friend: 0, instagram: 0, gym: 0, none: 0 };
    _acqClients.forEach(cl => {
      const k = cl.acq_source;
      clientCounts[k in clientCounts ? k : 'none']++;
    });

    main.innerHTML = `
      <div class="sec-card" style="margin-bottom:16px;">
        <div class="sec-card-title">📊 דרכי הגעה — מאמנים
          <span style="margin-right:auto;font-size:0.78rem;font-weight:400;color:var(--muted);">${coachTotal} מאמנים פעילים</span>
        </div>
        ${acqBar(ACQ_COACH.friend, byChannel.friend.length, coachTotal, ACQ_CLR.friend, arrow('friend'))}

  async function toggleCoachExpand(id, email) {
    coachExpanded[id] = !coachExpanded[id];
    renderCoachesTable();
    if (coachExpanded[id]) {
      const needNotifs = !coachNotifsCache[email];
      const needStats  = !coachStatsCache[email];
      const queries = [];
      if (needNotifs) queries.push(sb.from('coach_notifications').select('*').eq('coach_email', email).order('created_at', { ascending: false }).limit(5));
      else queries.push(Promise.resolve({ data: null }));
      if (needStats) {
        const coachClientEmails = clients.filter(cl => cl.coach_email === email).map(cl => cl.email);
        queries.push(sb.from('coach_sales').select('*').eq('coach_email', email).order('created_at', { ascending: false }));
        if (coachClientEmails.length) {
          queries.push(sb.from('training_plans').select('client_email').in('client_email', coachClientEmails));
          queries.push(sb.from('nutrition_plans').select('client_email').in('client_email', coachClientEmails));
        } else {
          queries.push(Promise.resolve({ data: [] }));
          queries.push(Promise.resolve({ data: [] }));
        }
      }
      const results = await Promise.all(queries);
      if (needNotifs && results[0].data) coachNotifsCache[email] = results[0].data;
      else if (needNotifs) coachNotifsCache[email] = [];
      if (needStats) {
        coachStatsCache[email] = {
          sales:   results[1].data || [],
          trPlans: (results[2].data || []).length,
          nuPlans: (results[3].data || []).length
        };
      }
      renderCoachesTable();
    }
  }

  async function changeCoachRole(id, role) {
    const c = coachesList.find(c => c.id === id);
    const payload = { role };
    // becoming a studio owner → give a license (like senior) + provision the studio + 2500 tokens
    if (role === 'studio_owner' && c) {
      const today = todayStr();
      const licEnd = new Date(); licEnd.setMonth(licEnd.getMonth() + 1);
      payload.license_start = today; payload.license_end = licEnd.toISOString().slice(0, 10);
    }
    const { error } = await sb.from('coaches').update(payload).eq('id', id);
    if (error) { toast('שגיאה בעדכון דרגה', 'err'); return; }
    if (role === 'studio_owner' && c) {
      await sb.from('studios').upsert({ owner_email: c.email, name: c.name || 'הסטודיו', client_capacity: 50, coach_capacity: 1 }, { onConflict: 'owner_email' });
      // ensure 2500 tokens baseline
      const { data: tok } = await sb.from('coach_tokens').select('balance').eq('coach_email', c.email).maybeSingle();
      if (!tok || (tok.balance || 0) < 2500) await grantCoachTokens(c.email, 2500 - (tok?.balance || 0));
      Object.assign(c, payload);
      toast('הפך לבעל סטודיו · סטודיו + רישיון + 2,500 טוקנים הופעלו ✓', 'ok');
    } else { if (c) c.role = role; toast('דרגה עודכנה ✓', 'ok'); }
    if (role !== 'pending') await rewardCoachReferral(c);  // 🤝 activation = referrer earns tokens
    renderCoachesTable();
  }

    const endDate = new Date();
    endDate.setMonth(endDate.getMonth() + months);
    const licEnd = endDate.toISOString().split('T')[0];
    const { error } = await sb.from('coaches').update({
      role: 'senior', license_start: today, license_end: licEnd

    if (c) { c.role = 'senior'; c.license_start = today; c.license_end = licEnd; }
    // הענקת טוקנים חודשיים אוטומטית
    await grantCoachTokens(c.email, months * 1000);

  async function saveCoachInfo(id, oldEmail) {
    const newName  = document.getElementById(`ci-name-${id}`)?.value.trim();
    const newEmail = document.getElementById(`ci-email-${id}`)?.value.trim().toLowerCase();
    if (!newName) { toast('שם לא יכול להיות ריק', 'err'); return; }
    if (!newEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) { toast('מייל לא תקין', 'err'); return; }

    const updates = { name: newName };
    const emailChanged = newEmail !== oldEmail;

    if (emailChanged) {
      const ok = confirm(`שינוי מייל מ-\n${oldEmail}\nל-\n${newEmail}\n\nהשינוי ישפיע על הכניסה למערכת. להמשיך?`);
      if (!ok) return;

      const _r = await adminCall({ action: 'rename_email', old_email: oldEmail, new_email: newEmail });
      if (_r?.error) { toast('שגיאת Auth: ' + _r.error, 'err'); return; }
      updates.email = newEmail;
    }

    const { error } = await sb.from('coaches').update(updates).eq('id', id);
    if (error) { toast('שגיאה: ' + error.message, 'err'); return; }

    const c = coachesList.find(x => x.id === id);
    if (c) { c.name = newName; if (emailChanged) c.email = newEmail; }
    renderCoachesTable();
    toast(`✓ פרטי המאמן עודכנו${emailChanged ? ' (כולל מייל)' : ''}`, 'ok');
  }

  /* 🤝 reward a coach who referred this now-activated coach (once). Reads the real
     balance from DB first so we never clobber the referrer's existing tokens. */
  const COACH_REFERRAL_REWARD = 500;
  async function rewardCoachReferral(referred) {
    if (!referred || !referred.referred_by_code || referred.referral_rewarded) return;
    const { data: referrer } = await sb.from('coaches').select('email,name').eq('referral_code', referred.referred_by_code).maybeSingle();
    if (!referrer || referrer.email === referred.email) return;
    const { data: tok } = await sb.from('coach_tokens').select('balance').eq('coach_email', referrer.email).maybeSingle();
    const newBal = (tok?.balance || 0) + COACH_REFERRAL_REWARD;
    const { error } = await sb.from('coach_tokens').upsert({ coach_email: referrer.email, balance: newBal, updated_at: new Date().toISOString() }, { onConflict: 'coach_email' });
    if (error) { console.error('referral reward:', error); return; }
    await sb.from('token_usage').insert({ coach_email: referrer.email, amount: -COACH_REFERRAL_REWARD, kind: 'referral', label: `הפניית מאמן — ${referred.name || referred.email}`, balance_after: newBal });
    if (typeof coachTokensCache !== 'undefined') coachTokensCache[referrer.email] = newBal;
    await sb.from('coaches').update({ referral_rewarded: true }).eq('email', referred.email);
    referred.referral_rewarded = true;
    toast(`🤝 ${referrer.name || referrer.email.split('@')[0]} קיבל ${COACH_REFERRAL_REWARD} טוקנים על ההפניה`, 'ok');
  }

  async function grantCoachTokens(email, amount, kind = 'purchase', label = 'רכישת טוקנים') {
    const cur = coachTokensCache[email] ?? 0;
    const newBal = cur + amount;
    const { error } = await sb.from('coach_tokens')
      .upsert({ coach_email: email, balance: newBal, updated_at: new Date().toISOString() }, { onConflict: 'coach_email' });
    if (error) { console.error('grantCoachTokens error:', error); toast('שגיאה: ' + error.message, 'err'); return; }
    coachTokensCache[email] = newBal;
    // רישום להיסטוריה (amount שלילי = זיכוי/רכישה)
    sb.from('token_usage').insert({ coach_email: email, amount: -amount, kind, label, balance_after: newBal }).then(()=>{});
    toast(`✓ נוספו ${amount} טוקנים (סה"כ: ${newBal})`, 'ok');
    renderCoachesTable();
  }

    const client0 = clients.find(c => c.email === email);
    const [{ data: tr }, { data: nu }, { data: co }, { data: deps }, { data: cds }] = await Promise.all([
      sb.from('training_plans').select('plan').eq('client_email', email).single(),
      sb.from('nutrition_plans').select('plan,archive').eq('client_email', email).single(),
      sb.from('coaches').select('plan_prices').eq('email', client0?.coach_email || '').maybeSingle(),
      sb.from('coach_deputies').select('deputy_email,note,active').eq('senior_email', client0?.coach_email || '').eq('active', true),
      sb.from('client_deputies').select('deputy_email').eq('client_email', email)
    ]);
    trainingPlan  = Array.isArray(tr?.plan) ? (tr.plan || []) : (tr?.plan?.active || []);
    _trainingArchive = Array.isArray(tr?.plan) ? [] : (tr?.plan?.archive || []);
    nutritionPlan = typeof stripNonMeals === 'function'
      ? stripNonMeals(nu?.plan || []).plan : (nu?.plan || []);   // שורות סיכום אינן ארוחות
    nutritionArchive = Array.isArray(nu?.archive) ? nu.archive : [];
    _coachPrices   = co?.plan_prices || {};
    _coachDeputies = deps || [];
    _clientDeputy  = (cds || [])[0]?.deputy_email || null;
    renderMain(client0);
    renderNutriArchive();
  }

  /* הצמדת סגן ללקוח. האחסון תומך בכמה סגנים ללקוח, והבחירה כאן
     יחידה — ולכן בחירה חדשה מוחקת קודם את הקיימות, אחרת סגן קודם
     היה ממשיך לראות אותו בלי שזה נראה בשום מקום.
     senior_email נלקח מהמאמן של הלקוח ולא ממנהל המערכת: הוא בעל
     התיק, והמדיניות במסד נשענת עליו. */
  async function setClientDeputy(deputyEmail, sel) {
    if (!activeEmail) return;
    const c = clients.find(x => x.email === activeEmail);
    if (!c || !c.coach_email) { toast('ללקוח אין מאמן משויך', 'err'); return; }
    if (sel) sel.disabled = true;
    const { error: delErr } = await sb.from('client_deputies').delete().eq('client_email', activeEmail);
    let error = delErr;
    if (!error && deputyEmail) {
      ({ error } = await sb.from('client_deputies').insert({
        client_email: activeEmail, deputy_email: deputyEmail, senior_email: c.coach_email }));
    }
    if (sel) sel.disabled = false;
    if (error) {
      toast('שגיאה: ' + error.message, 'err');
      if (sel) sel.value = _clientDeputy || '';       // חוזר למצב האמיתי
      return;
    }
    _clientDeputy = deputyEmail || null;
    toast(deputyEmail ? 'הוצמד לסגן ✓' : 'ההצמדה הוסרה', 'ok');
  }

  function renderNutriArchive() {
    const el = document.getElementById('nutrition-archive-list');
    if (!el) return;
    if (!nutritionArchive.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div style="font-size:0.78rem;color:#9bb3ff;font-weight:800;margin:14px 0 7px;">🗄️ תפריטים קודמים</div>' +
      nutritionArchive.map((b, bi) => {
        const when = b.archived_at ? new Date(b.archived_at).toLocaleDateString('he-IL') : '';
        const meals = (b.plan || []).length;
        const cal = (b.plan || []).reduce((s, m) => s + (m.items || []).reduce((a, it) => a + (+it.calories || 0), 0), 0);
        return `<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(120,150,255,0.2);
          border-radius:8px;padding:9px 12px;margin-bottom:7px;display:flex;align-items:center;
          justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div>
            <div style="font-weight:900;font-size:0.85rem;color:#9bb3ff;">${esc(b.label || 'תפריט קודם')}</div>
            <div style="font-size:0.72rem;color:#666;">${when} · ${meals} ארוחות · ${Math.round(cal)} קק"ל</div>
          </div>
          <button class="btn-sm btn-outline" style="border-color:rgba(74,222,128,0.4);color:#4ade80;
            font-size:0.72rem;padding:4px 9px;" onclick="restoreNutriArchive(${bi})">↩ שחזר</button>
        </div>`;
      }).join('');
  }

  /* השחזור מחליף את הפעיל, ולכן הפעיל נכנס לארכיון לפני כן — אחרת
     שחזור בטעות היה מוחק את מה שהיה, וזו התקלה שהארכיון נועד למנוע. */
  async function restoreNutriArchive(bi) {
    if (!requireEdit()) return;
    const b = nutritionArchive[bi];
    if (!b) return;
    if (!confirm(`לשחזר את "${b.label || 'תפריט קודם'}"?\n\nהתפריט הנוכחי יישמר בארכיון ותוכל לחזור אליו.`)) return;
    const arch = nutritionArchive.slice();
    if ((nutritionPlan || []).length) {
      arch.push({ label: 'לפני שחזור · ' + new Date().toLocaleDateString('he-IL'),
        plan: JSON.parse(JSON.stringify(nutritionPlan)), archived_at: new Date().toISOString() });
    }
    arch.splice(bi, 1);
    const restored = JSON.parse(JSON.stringify(b.plan || []));
    const { error } = await sb.from('nutrition_plans').upsert({
      client_email: activeEmail, plan: restored, archive: arch.slice(-10),
      updated_at: new Date().toISOString() }, { onConflict: 'client_email' });
    if (error) { toast('שגיאה בשחזור: ' + error.message, 'err'); return; }
    nutritionPlan = restored;
    nutritionArchive = arch.slice(-10);
    renderNutritionEditor();
    renderNutriArchive();
    toast('התפריט שוחזר ✓', 'ok');
  }

    if (Array.isArray(spec)) return spec;

    if (m) {
      const count = Math.min(parseInt(m[1]), 10);
      const parts = m[2].split('/');
      return Array.from({length: count}, (_, i) => {
        const r = parseInt(parts[i] || parts[parts.length-1]) || 10;
        return { reps_min: r, reps_max: r, recommended_kg: 0 };
      });
    }
    m = s.match(/^(\d+)[x×X](\d+)-(\d+)/);
    if (m) return Array.from({length: parseInt(m[1])}, () => ({ reps_min: parseInt(m[2]), reps_max: parseInt(m[3]), recommended_kg: 0 }));

### 1. טכניקות — אילו קיימות ומתי להשתמש
המערכת מכירה רק את הטכניקות הבאות:
- פירמידה (5×20/15/12/10/8) — תרגילים מורכבים בלבד
- Rest Pause — תרגילים מורכבים יציבים בלבד (סמית, מכונות, לחיצות, RDL)
- 6 איטי 6 מהיר — תרגילים מורכבים בלבד
- Isomix — תרגילים מבודדים במכונה/כבל בלבד
- Isomix Advanced — תרגילים מבודדים במכונה/כבל בלבד
- IsoBurst — תרגילים מבודדים במכונה/כבל בלבד
- Drop Set — תרגילים מבודדים בלבד

### 2. חוקי שימוש בטכניקות
- Isomix / Isomix Advanced / IsoBurst — מבודדים בלבד! אסור בתרגיל מורכב!
- לא יותר מ-2 טכניקות מתקדמות בכל אימון (לא בכל תרגיל)
- טכניקה רק בסטים העובדים — לא בסט חימום
- תרגילים מורכבים כבדים (סקוואט, דדליפט) — ראשונים באימון לפני כל עייפות

### 3. תרגיל מורכב vs. מבודד
מורכב — מערב כמה מפרקים: לחיצות, סקוואט, דדליפט, חתירה, מתח, פולי עליון, היפ טראסט, לחיצה צרה
מבודד — שריר אחד: כפיפת מרפקים, פשיטת מרפקים, פרפר, הרחקות, פייס פול, כפיפת ברך, פשיטת ברך, קרוסאובר, הרחקת כתף

### 4. פירמידה 5×20/15/12/10/8 — תרגיל מורכב
כל סט — משקל עולה, חזרות יורדות:
- סט 1 (20) = חימום מפרקים, קל, לא לכשל
- סט 2 (15) = התחלת עומס
- סט 3 (12) = אזור היפרטרופיה מרכזי
- סט 4 (10) = כבד, עומס מכני גבוה
- סט 5 (8) = הכי כבד, RIR 1-2
רוב הסטים RIR 1-2. רק הסט האחרון לפעמים עד כשל.

### 5. מבנה Rest Pause (תרגיל מורכב יציב)
עובדים עד כמעט כשל → 10-15 שניות מנוחה → עוד חזרות → אפשר חזרה נוספת.

### 6. מבנה 6 איטי 6 מהיר (תרגיל מורכב)
6 חזרות איטיות (TUT, שליטה, Stretch) + ישר 6 חזרות מהירות (פאמפ, סיבים מהירים).

### 7. מבנה Isomix (מבודד, מכונה/כבל)
כל חזרה = תנועה מלאה + עצירה 3-5 שניות בכיווץ המקסימלי.

### 8. מבנה Isomix Advanced (מבודד, מכונה/כבל)
5 חזרות Hold 5 שניות → 5 חזרות Hold 10 שניות → 5 חזרות Hold 15 שניות.

### 9. מבנה IsoBurst (מבודד, מכונה/כבל — הכי מתקדם)
חוק: משך Hold = מספר חזרות שבוצעו.
סט 1: 15 שניות עבודה + Hold.
סט 2: 60 שניות ÷ 4 חלקים של 15 שניות, Hold אחרי כל חלק.
סט 3: 30 שניות ÷ 2 חלקים, Drop אחרי כל חלק.
סט 4: 45 שניות ÷ 3 חלקים, Drop אחרי כל חלק.

### 10. Drop Set (מבודד)
הורדת משקל ללא מנוחה: 8 / 8 / 8 (הורדה 20% בכל שלב).

### 11. נפח לפי גודל שריר
שרירים גדולים (גב, חזה, רגליים) — עד 20-25 סטים.
שרירים קטנים (ידיים, כתפיים) — עד 12-16 סטים.

### 12. סדר חובה באימון
1. תרגיל מורכב כבד ראשון (סקוואט / דדליפט / לחיצה)
2. תרגיל מורכב שני
3. מכונות / מבודדים
4. פאמפ + טכניקות

### 13. שדה notes — חובה לקרוא
מלא notes רק אם המאמן ציין במפורש טכניקה ליד התרגיל (לדוגמה: "6 איטי 6 מהיר", "Rest Pause", "Isomix", "Drop Set", "איטי בירידה").
אם המאמן לא כתב דבר מעבר לשם ולסטים — השאר notes ריק לחלוטין "".

### 14. עומס מתקדם (Progressive Overload)
המערכת שואפת להתקדמות שבועית — כוון להעלאה קטנה במשקל או בחזרות באותו תרגיל מול השבוע הקודם.

### 15. עצימות מטרה (RIR)
רוב הסטים RIR 1-2; רק הסט האחרון לעיתים עד כשל. הימנע מכשל מוקדם שפוגע בנפח ובהתאוששות.

### 16. הטיה לנקודה חלשה (אסתטיקה)
שריר מפגר/נקודה חלשה — ראשון באימון ובנפח מעט גבוה יותר, כדי לפסל פרופורציות.

### 17. מתיחה תחת עומס
שלב תרגילים עם מתיחה עמוקה בעומס (בייספס בשיפוע, RDL, פרפר/פלייז) — מפתח גדילה ואסתטיקה.

### 18. דילאוד — לפי החלטת המאמן
דילאוד כל 8-12 שבועות, לא אוטומטי — לפי החלטת המאמן. בשבוע דילאוד: כ-50% נפח, RIR 3-4, ללא כשל.

### 19. חלופת תרגיל בטוחה
בהחלפת תרגיל עקב פציעה — בחר תרגיל מאותה קבוצת שריר עם עומס מפרקי נמוך יותר.

ב) פחמימות: אך ורק איכותיות — פסטה, אורז, תפוח אדמה, בטטה, שיבולת שועל, כוסמת, קינואה, פריכיות. בחיטוב ובמסה מותר להוסיף גם לחמים (לחם מלא/פיתה מחיטה מלאה). אין פחמימות ריקות/מתוקות מחוץ לארוחות סביב האימון.

  const PLAN_MONTHS = { 'ליווי חודשי': 1, 'ליווי 3 חודשים': 3, 'ליווי 4 חודשים': 4, 'ליווי חצי שנה': 6, 'ליווי שנתי': 12 };
  const _addMonths = (dateStr, months) => {
    const d = new Date(dateStr + 'T12:00:00'); d.setMonth(d.getMonth() + months);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  function syncClientEnd() {

  async function saveProfile() {
    const name       = document.getElementById('e-name').value.trim();
    const phone      = document.getElementById('e-phone').value.trim();
    const coachEmail = document.getElementById('e-coach').value || null;
    const start = document.getElementById('e-start').value;
    const end   = document.getElementById('e-end').value;
    const plan  = document.getElementById('e-plan').value;
    const cal    = parseInt(document.getElementById('e-cal').value)    || null;
    const prot   = parseInt(document.getElementById('e-prot').value)   || null;
    const carb   = parseInt(document.getElementById('e-carb').value)   || null;
    const fat    = parseInt(document.getElementById('e-fat').value)    || null;
    const water  = parseFloat(document.getElementById('e-water').value)  || null;
    const weight = parseFloat(document.getElementById('e-weight').value) || null;

    /* שינוי מייל: מעדכן את כל הטבלאות (RPC) ואת משתמש ההתחברות (Auth).
       השדה היה readonly עד עכשיו — ולכן לאדמין לא הייתה דרך לשנות מייל של לקוח. */
    const newEmail = document.getElementById('e-email')?.value.trim().toLowerCase() || activeEmail;
    if (newEmail !== activeEmail) {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) { toast('מייל לא תקין', 'err'); return; }
      const { data: existing } = await sb.from('clients').select('email').eq('email', newEmail).maybeSingle();
      if (existing) { toast('כבר קיים לקוח עם המייל הזה', 'err'); return; }
      if (!confirm(`שינוי מייל מ-\n${activeEmail}\nל-\n${newEmail}\n\nהשינוי משפיע על ההתחברות. להמשיך?`)) return;
      /* ההתחברות משתנה ראשונה. קודם שונו הנתונים ורק אחר כך ההתחברות,
         וכשהשלב השני נכשל נשאר מתאמן עם נתונים תחת מייל אחד והתחברות
         תחת אחר — כלומר לא מצליח להיכנס. */
      const _r = await adminCall({ action: 'rename_email', old_email: activeEmail, new_email: newEmail });
      if (_r?.error) { toast('שגיאה בעדכון מייל התחברות: ' + _r.error, 'err'); return; }
      const { error: rpcErr } = await sb.rpc('rename_client_email', { p_old: activeEmail, p_new: newEmail });
      if (rpcErr) {
        const back = await adminCall({ action: 'rename_email', old_email: newEmail, new_email: activeEmail });
        toast(back?.error
          ? `שגיאה בשינוי מייל: ${rpcErr.message} — מייל ההתחברות כבר שונה ל-${newEmail} והנתונים נשארו תחת ${activeEmail}. יש להשלים ידנית.`
          : 'שגיאה בשינוי מייל: ' + rpcErr.message, 'err');
        return;
      }
      activeEmail = newEmail;
    }

    const { error } = await sb.from('clients')
      .update({ name, phone, coach_email: coachEmail, coaching_start: start, coaching_end: end, plan_type: plan,
                target_calories: cal, target_protein: prot, target_carbs: carb, target_fat: fat,
                target_water: water, current_weight: weight,
                /* ריק = לפי המחירון ולכן NULL; אפס הוא מחיר אמיתי */
                subscription_price: (document.getElementById('e-price')?.value.trim() || '') === ''
                  ? null : Number(document.getElementById('e-price').value),
                auto_renew: !!document.getElementById('e-autorenew')?.checked })
      .eq('email', activeEmail);
    if (error) { toast('שגיאה בשמירה: ' + error.message, 'err'); return; }
    await loadClients();
    toast('פרטים נשמרו ✓', 'ok');
  }

  async function setClientPassword() {

      return;

    const _r = await adminCall({ action: 'set_password', email, password });

    toast(`✓ סיסמה הוגדרה: ${password}`, 'ok');
  }

  /* מתרגם שגיאת מסד נתונים להודעה שאפשר לפעול לפיה */
  function dbErrHe(error) {
    const c = error?.code || '', m = error?.message || '';
    if (c === '23505' || /duplicate key/i.test(m)) return 'המייל הזה כבר רשום במערכת.';
    if (c === '42501' || /row-level security|permission denied/i.test(m))
      return 'אין הרשאה להוסיף לקוח. התנתק והתחבר מחדש ונסה שוב.';
    if (c === '23514') return 'אחד הערכים שנבחרו אינו נתמך במערכת.';
    if (c === '23503') return 'המאמן המשויך לא נמצא במערכת.';
    if (/Failed to fetch|NetworkError/i.test(m)) return 'אין חיבור לשרת. בדוק את החיבור לאינטרנט ונסה שוב.';
    return 'שגיאה בשמירה: ' + m;
  }

  async function addClient() {
    const errEl = document.getElementById('add-err');
    const btn   = document.getElementById('add-btn');
    if (btn.disabled) return;                       // הגנה מלחיצה כפולה
    const done = () => { btn.disabled = false; btn.textContent = 'הוסף לקוח'; };
    const fail = msg => { errEl.textContent = msg; errEl.style.display = 'block'; done(); };

    const name  = document.getElementById('new-name').value.trim();
    // Supabase Auth ממיר מיילים לאותיות קטנות — בלי נרמול נוצר לקוח שלא עובר בדיקות הרשאה
    const email = document.getElementById('new-email').value.trim().toLowerCase();
    const start = document.getElementById('new-start').value;
    const end   = document.getElementById('new-end').value;
    const plan  = document.getElementById('new-plan').value;
    errEl.style.display = 'none';

    if (!name || !email || !start || !end)            return fail('יש למלא את כל השדות');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail('כתובת המייל אינה תקינה');
    if (end < start)                                   return fail('תאריך סיום המנוי מוקדם מתאריך ההתחלה');
    btn.disabled = true; btn.textContent = 'מוסיף...';

    const { data: dup } = await sb.from('clients').select('email,name').eq('email', email).maybeSingle();
    if (dup) return fail(`${dup.name || email} כבר קיים במערכת.`);

    // Insert client record — הלקוח מתחבר דרך Magic Link בלבד
    const insertData = { email, name, coaching_start: start, coaching_end: end, plan_type: plan };
    if (addClientForCoach) insertData.coach_email = addClientForCoach;
    const { data: created, error: insErr } = await sb.from('clients')
      .insert(insertData).select('email').maybeSingle();
    if (insErr)   return fail(dbErrHe(insErr));
    if (!created) return fail('הלקוח לא נשמר. נסה שוב, ואם זה חוזר — התנתק והתחבר מחדש.');
    done();

    const wasForCoach = !!addClientForCoach;
    closeAddModal();
    await loadClients();
    if (wasForCoach) renderCoachesTable();
    toast(`${name} נוסף בהצלחה ✓`, 'ok');
  }

      item.innerHTML = `<span>${hlMatch(ex.name, q)}</span><span style="font-size:0.72rem;color:var(--muted);">${label}</span>`;
      item.onmousedown = () => {

        hideExSugg();
      };
      item.onmouseover = () => item.style.background = 'rgba(255,107,0,0.1)';
      item.onmouseout  = () => item.style.background = '';
      drop.appendChild(item);
    });

    document.body.appendChild(drop);

    return esc(name.slice(0, idx)) +
      `<span style="color:var(--orange);font-weight:700;">${esc(name.slice(idx, idx + q.length))}</span>` +
      esc(name.slice(idx + q.length));

      item.onmousedown = () => {
        nutritionPlan[mi].items[ii].food     = f.name;
        nutritionPlan[mi].items[ii].calories = f.calories;
        nutritionPlan[mi].items[ii].protein  = f.protein;
        nutritionPlan[mi].items[ii].carbs    = f.carbs;
        nutritionPlan[mi].items[ii].fat      = f.fat;
        if (!nutritionPlan[mi].items[ii].quantity) nutritionPlan[mi].items[ii].quantity = '100 גרם';
        hideFoodSuggAdmin();
        renderNutritionEditor();
      };
      item.onmouseover = () => item.style.background = 'rgba(255,107,0,0.1)';

  function hideFoodSuggAdmin() {
