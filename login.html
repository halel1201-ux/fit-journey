<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <script>/* opened as a local file:// copy — fetch/SW are blocked there; jump to the live site */if(location.protocol==='file:')location.replace('https://halel1201-ux.github.io/fit-journey/'+location.pathname.split('/').pop()+location.search);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="manifest" href="manifest.json">

  <title>כניסה — HF Coaching</title>
  <link rel="preconnect" href="https://luwknflmhvcxgifzxgrk.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet"/>
  <!-- self-hosted: in the native app this loads from the bundle instead of
       making a blocking round trip to jsdelivr on every page switch -->
  <script src="vendor/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --orange:#FF6B00; --gold:#FFD700; --black:#090909; --white:#fff; --muted:#aaa; }
    body {
      font-family: 'Heebo', sans-serif;
      background: radial-gradient(ellipse 70% 50% at 50% 100%, rgba(255,107,0,0.13) 0%, transparent 70%), var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 400px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,107,0,0.3);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 0 60px rgba(255,107,0,0.1);
    }
    .card-top {
      padding: 32px 28px 22px; text-align: center;
      background: linear-gradient(135deg, rgba(255,107,0,0.08), transparent);
      border-bottom: 1px solid rgba(255,107,0,0.12);
    }
    .fj-icon {
      width: 76px; height: 76px;
      background: linear-gradient(145deg, #FF6B00 0%, #FF8C00 55%, #FFD700 100%);
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      position: relative; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,107,0,0.4), 0 8px 32px rgba(255,107,0,0.45), 0 2px 8px rgba(0,0,0,0.6);
    }
    .fj-icon::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 52%;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
      border-radius: 22px 22px 0 0;
    }
    .fj-icon span {
      font-family: 'Arial Black', 'Heebo', sans-serif;
      font-size: 2rem; font-weight: 900; color: #fff;
      letter-spacing: -1.5px; z-index: 1;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    /* coach-branded icon: the artwork sits inside the frame, so kill the FJ gloss */
    .fj-icon.branded::before { display: none; }
    .fj-icon img { width: 72%; height: 72%; object-fit: contain; z-index: 1; }
    .fj-icon.branded.full img { width: 100%; height: 100%; }
    .hf-sub { font-size: 0.77rem; color: var(--muted); letter-spacing: 1.5px; margin-top: 4px; }
    .card-body { padding: 28px 28px 32px; }

    /* MODE TABS */
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
    .mode-tab {
      flex: 1; padding: 9px; border-radius: 8px; font-family: 'Heebo', sans-serif;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; text-align: center;
      border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--muted);
      transition: all 0.2s;
    }
    .mode-tab.active {
      background: rgba(255,107,0,0.12); border-color: rgba(255,107,0,0.4); color: var(--orange);
    }

    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
    .field input {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: var(--white); font-family: 'Heebo', sans-serif;
      font-size: 0.97rem; direction: ltr; text-align: right; outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--orange); }
    .btn-go {
      width: 100%; padding: 13px; margin-top: 4px;
      background: linear-gradient(135deg, var(--orange), var(--orange2, #FF8C00));
      color: var(--btn-fg, var(--white)); font-family: 'Heebo', sans-serif;
      font-size: 1rem; font-weight: 700; border: none; border-radius: 8px;
      cursor: pointer; transition: opacity 0.2s, transform 0.15s;
    }
    .btn-go:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-go:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .msg { padding: 12px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; display: none; line-height: 1.6; }
    .msg.err { background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.3); color: #ff7070; }
    .msg.ok  { background: rgba(60,200,60,0.08); border: 1px solid rgba(60,200,60,0.3); color: #70dd70; text-align: center; }
    .hint { font-size: 0.77rem; color: #555; text-align: center; margin-top: 16px; line-height: 1.5; }
    .remember-row {
      display: flex; align-items: center; gap: 8px;
      margin: 14px 0 2px; cursor: pointer; user-select: none;
    }
    .remember-row input[type=checkbox] { display: none; }
    .remember-box {
      width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
      border: 1.5px solid rgba(255,107,0,0.4); background: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s;
    }
    .remember-row input:checked + .remember-box {
      background: var(--orange); border-color: var(--orange);
    }
    .remember-row input:checked + .remember-box::after {
      content: '✓'; font-size: 0.75rem; font-weight: 900; color: #fff; line-height: 1;
    }
    .remember-label { font-size: 0.82rem; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div class="fj-icon" id="fj-icon"><span>FJ</span></div>
    <div class="hf-sub" id="fj-sub">FIT JOURNEY · אזור אישי</div>
  </div>
  <script>
  /* Coach branding, cached by dashboard.html on a previous launch — applied inline
     (before paint) so the trainee never sees the generic FJ mark flash first. */
  (function(){
    var b = null;
    try { b = JSON.parse(localStorage.getItem('fj_brand_cache') || 'null'); } catch(e) {}
    if (!b) return;
    var frame = b.frame || b.color || null;
    var el = document.getElementById('fj-icon');
    if (b.icon && el) {
      el.classList.add('branded');
      if (b.full) el.classList.add('full');
      el.innerHTML = '<img src="' + b.icon + '" alt=""/>';
    }
    if (frame && el) {
      el.style.background = 'linear-gradient(145deg,' + frame + ' 0%,' + frame + 'cc 100%)';
      el.style.boxShadow = '0 0 0 1px ' + frame + '66, 0 8px 32px ' + frame + '73, 0 2px 8px rgba(0,0,0,0.6)';
    }
    if (b.name) {
      var sub = document.getElementById('fj-sub');
      if (sub) sub.textContent = b.name + ' · אזור אישי';
    }
    if (b.color) {
      document.documentElement.style.setProperty('--orange', b.color);
      document.documentElement.style.setProperty('--orange2', b.color);
      /* White is one of the offered brand swatches, and white button text on a
         near-white button is invisible. Pick the label colour from the
         background's luminance instead of assuming a dark brand. */
      var hex = String(b.color).replace('#', '');
      if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      if (/^[0-9a-fA-F]{6}$/.test(hex)) {
        var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), bl = parseInt(hex.slice(4,6),16);
        var lum = (0.299*r + 0.587*g + 0.114*bl) / 255;   // perceived brightness
        if (lum > 0.6) document.documentElement.style.setProperty('--btn-fg', '#111');
      }
    }
  })();
  </script>
  <div class="card-body">
    <div class="msg err" id="err"></div>
    <div class="msg ok"  id="ok"></div>

    <!-- MODE TABS -->
    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-pass" onclick="setMode('password')">סיסמה</button>
      <button class="mode-tab"        id="tab-link" onclick="setMode('magic')">קישור למייל</button>
    </div>

    <div id="form-wrap">
      <div class="field">
        <label>כתובת אימייל</label>
        <input type="email" id="email" placeholder="your@email.com" autofocus/>
      </div>

      <!-- Password field — shown in password mode -->
      <div class="field" id="pass-field">
        <label>סיסמה</label>
        <input type="password" id="password" placeholder="הכנס סיסמה"/>
      </div>

      <!-- Remember me — shown only in password mode -->
      <label class="remember-row" id="remember-row">
        <input type="checkbox" id="remember-me" checked/>
        <span class="remember-box"></span>
        <span class="remember-label">השאר אותי מחובר</span>
      </label>

      <button class="btn-go" id="btn" onclick="handleSubmit()">כניסה</button>
      <p class="hint" id="hint">הסיסמה הוגדרה עבורך על ידי המאמן.</p>
      <p class="hint" style="margin-top:10px;"><a href="privacy.html" style="color:var(--muted);text-decoration:underline;">מדיניות פרטיות</a> · <a href="terms.html" style="color:var(--muted);text-decoration:underline;">תנאי שימוש</a></p>
    </div>
  </div>
</div>

<script>
  const URL_ = 'https://luwknflmhvcxgifzxgrk.supabase.co';
  const KEY  = 'sb_publishable_k3M7SfBeiBGs3rTKewBzWQ_7RHRskB9';
  const ADMIN = 'halel1201@gmail.com';
  const sb = supabase.createClient(URL_, KEY);

  let currentMode = 'password';

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('tab-pass').classList.toggle('active', mode === 'password');
    document.getElementById('tab-link').classList.toggle('active', mode === 'magic');
    document.getElementById('pass-field').style.display = mode === 'password' ? 'block' : 'none';
    document.getElementById('remember-row').style.display = mode === 'password' ? 'flex' : 'none';
    document.getElementById('btn').textContent = mode === 'password' ? 'כניסה' : 'שלח קישור כניסה';
    document.getElementById('hint').textContent = mode === 'password'
      ? 'הסיסמה הוגדרה עבורך על ידי המאמן.'
      : 'ישלח אליך קישור כניסה ישירות לאימייל.';
    document.getElementById('err').style.display = 'none';
    document.getElementById('ok').style.display = 'none';
  }

  // If already logged in — redirect
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) redirect(session.user.email);
  });

  // Handle magic link redirect
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) redirect(session.user.email);
  });

  /* הניתוב אחרי התחברות מוצלחת.

     קודם רצו כאן שתי שאילתות בזו אחר זו, וכל אחת המתינה לקודמתה. כשמסד
     הנתונים עמוס — נמדדו 2 עד 12 שניות לשאילתה, ובקצה גם 44 — המתאמן
     נשאר תקוע על מסך ההתחברות אחרי שההזדהות כבר הצליחה, וזה נראה כמו
     "לא מצליח להתחבר".

     שני שינויים: השאילתות רצות במקביל במקום בטור, ויש תקרת המתנה.
     כשהתקרה נחצית מנתבים ללוח המתאמן — הרוב המכריע — במקום להישאר
     תקועים. ניתוב שגוי מתקן את עצמו בעמוד היעד; המתנה אינסופית לא. */
  const ROUTE_TIMEOUT_MS = 4000;

  async function redirect(email) {
    if (email === ADMIN) { window.location.href = 'admin.html'; return; }
    const go = p => { window.location.href = p; };
    try {
      const lookup = Promise.all([
        sb.from('coaches').select('email').eq('email', email).maybeSingle(),
        sb.from('clients').select('email').eq('email', email).maybeSingle(),
      ]);
      const timeout = new Promise(r => setTimeout(() => r(null), ROUTE_TIMEOUT_MS));
      const res = await Promise.race([lookup, timeout]);
      if (!res) { go(lastRoute()); return; }                   // עמוס מדי — לא נשארים תקועים
      const [{ data: coach }, { data: client }] = res;
      const dest = coach && !client ? 'coach.html' : 'dashboard.html';
      try { localStorage.setItem('fj_route', dest); } catch (_) { }
      go(dest);
    } catch (e) {
      go(lastRoute());
    }
  }

  /* לאן לנתב כשהבירור לא הספיק. מאמן שנכנס בעבר יגיע לפאנל שלו גם
     כשמסד הנתונים עמוס, במקום להיזרק ללוח מתאמן ריק. מי שלא נכנס
     מעולם מקבל את ברירת המחדל — הרוב המכריע הם מתאמנים. */
  function lastRoute() {
    try {
      const v = localStorage.getItem('fj_route');
      if (v === 'coach.html' || v === 'admin.html') return v;
    } catch (_) { }
    return 'dashboard.html';
  }

  function handleSubmit() {
    if (currentMode === 'password') loginWithPassword();
    else sendLink();
  }

  async function loginWithPassword() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember-me').checked;
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    err.style.display = 'none';
    if (!email || !password) { err.textContent = 'יש למלא אימייל וסיסמה'; err.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'נכנס...';
    const { error } = await sb.auth.signInWithPassword({ email, password, options: { persistSession: remember } });
    btn.disabled = false; btn.textContent = 'כניסה';
    if (error) { err.textContent = 'אימייל או סיסמה שגויים'; err.style.display = 'block'; }
  }

  async function sendLink() {
    const email = document.getElementById('email').value.trim();
    const err = document.getElementById('err');
    const ok  = document.getElementById('ok');
    const btn = document.getElementById('btn');
    err.style.display = 'none'; ok.style.display = 'none';
    if (!email) { err.textContent = 'יש להזין כתובת אימייל'; err.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'שולח...';
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href }
    });
    btn.disabled = false; btn.textContent = 'שלח קישור כניסה';
    if (error) { err.textContent = 'שגיאה בשליחה. בדוק את האימייל ונסה שוב.'; err.style.display = 'block'; return; }
    ok.textContent = '✓ קישור נשלח! בדוק את תיבת הדואר שלך.';
    ok.style.display = 'block';
    document.getElementById('form-wrap').style.opacity = '0.4';
    document.getElementById('form-wrap').style.pointerEvents = 'none';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
</script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e));
    }
  </script></body>
</html>
